name: Deploy sprite search
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Check catalog and assets
        run: |
          python3 scripts/prepare-previews.py
          python3 scripts/prepare-dialogue-data.py
          python3 scripts/check-site.py
          python3 scripts/check-backgrounds.py
          python3 scripts/check-artwork.py
          python3 scripts/check-naming.py
          python3 scripts/check-dialogue.py
          python3 scripts/test-dialogue-compiler.py
          node scripts/test-dialogue-search.cjs
          node scripts/test-dialogue-worker.cjs
          node scripts/test-dialogue-reading.cjs
          node scripts/test-dialogue-scene.cjs
          node scripts/check-cg-story.cjs
          node --check --input-type=module < dist/cg-story.js
          node --check dist/dialogue/scene-view.js
          node --check dist/dialogue/continuous-reader.js
          node --check dist/dialogue/app.js
          node --check dist/dialogue/search-worker.js
          node --check dist/dialogue/data-loader.js
          node --check dist/app.js
          node --check dist/experience.js
          node --check dist/archive-stage.js
          node --check dist/mobile-ui.js
          node --check --input-type=module < dist/archive-scene.js
          node --check dist/artwork-downloads.js
          node --check dist/backgrounds/app.js
          node --check dist/backgrounds/zip-store.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
